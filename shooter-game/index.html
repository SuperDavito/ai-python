<title>Sterrenjager</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
  /* Layout: one arcade cabinet screen, centred and scaled to fit; HUD lives inside the canvas */
  :root {
    --void: #0b0a1f;
    --hull: #1c1946;
    --ion: #5ce1ff;
    --mint: #7dffb2;
    --gold: #ffd166;
    --flare: #ff6b5a;
    --spark: #ff4fa3;
    --plasma: #b98bff;
    --text: #ecebff;
    --dim: #8f8bc2;
    --display: "Chakra Petch", "Segoe UI", system-ui, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
    color-scheme: dark;
  }
  html { height: 100%; box-sizing: border-box; background: var(--void); }
  *, *::before, *::after { box-sizing: inherit; }
  [hidden] { display: none !important; }
  body {
    height: 100%;
    margin: 0;
    padding-block: 12px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    background: radial-gradient(ellipse at 50% 30%, var(--hull), var(--void) 70%);
    color: var(--text);
    font-family: var(--display);
  }
  #stage { position: relative; width: 320px; height: 480px; max-width: 100%; }
  #screen {
    display: block;
    width: 100%;
    height: 100%;
    border-radius: 10px;
    touch-action: none;
    cursor: crosshair;
    box-shadow: 0 0 0 1px color-mix(in srgb, var(--ion) 35%, transparent),
                0 0 40px color-mix(in srgb, var(--ion) 18%, transparent);
  }
  .controls { position: absolute; top: 10px; right: 10px; display: flex; gap: 6px; }
  .controls button {
    width: 36px;
    height: 36px;
    display: grid;
    place-items: center;
    padding: 0;
    border: 1px solid color-mix(in srgb, var(--ion) 45%, transparent);
    border-radius: 8px;
    background: color-mix(in srgb, var(--void) 70%, transparent);
    color: var(--ion);
    cursor: pointer;
  }
  .controls button:hover { background: var(--hull); }
  .controls button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  .controls svg { width: 18px; height: 18px; }
</style>

<div id="stage">
  <canvas id="screen" aria-label="Sterrenjager speelveld"></canvas>
  <div class="controls">
    <button id="soundBtn" type="button" aria-label="Geluid aan of uit"></button>
    <button id="pauseBtn" type="button" aria-label="Pauze" hidden>
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
    </button>
  </div>
</div>

<script>
(() => {
  const W = 480, H = 720, STEP = 1000 / 60;
  const SECTOR_POINTS = 350;
  const BOSS_EVERY = 4;
  const HIGH_KEY = "sterrenjager.highscore";
  const MUTE_KEY = "sterrenjager.muted";

  const css = getComputedStyle(document.documentElement);
  const C = {};
  for (const k of ["void", "hull", "ion", "mint", "gold", "flare", "spark", "plasma", "text", "dim"]) {
    C[k] = css.getPropertyValue("--" + k).trim();
  }
  const DISPLAY = '"Chakra Petch", "Segoe UI", system-ui, sans-serif';
  const MONO = '"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace';
  const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

  const stage = document.getElementById("stage");
  const canvas = document.getElementById("screen");
  const ctx = canvas.getContext("2d");
  const soundBtn = document.getElementById("soundBtn");
  const pauseBtn = document.getElementById("pauseBtn");

  const rand = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const pad = (n, len) => String(n).padStart(len, "0");
  const pick = (weights) => {
    const entries = Object.entries(weights).filter(([, w]) => w > 0);
    let r = Math.random() * entries.reduce((s, [, w]) => s + w, 0);
    for (const [k, w] of entries) { if ((r -= w) < 0) return k; }
    return entries[0][0];
  };

  // ---------- storage (per browser, optional) ----------
  function loadHigh() { try { return parseInt(localStorage.getItem(HIGH_KEY), 10) || 0; } catch { return 0; } }
  function saveHigh(v) { try { localStorage.setItem(HIGH_KEY, String(v)); } catch {} }
  function loadMuted() { try { return localStorage.getItem(MUTE_KEY) === "1"; } catch { return false; } }
  function saveMuted(v) { try { localStorage.setItem(MUTE_KEY, v ? "1" : "0"); } catch {} }

  // ---------- sound (synthesised, starts after first interaction) ----------
  let actx = null, noiseBuf = null, muted = false;
  function audio() {
    if (!actx) {
      try {
        actx = new (window.AudioContext || window.webkitAudioContext)();
        noiseBuf = actx.createBuffer(1, actx.sampleRate, actx.sampleRate);
        const d = noiseBuf.getChannelData(0);
        for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      } catch { actx = null; }
    }
    if (actx && actx.state === "suspended") actx.resume().catch(() => {});
  }
  function tone(f1, f2, dur, type = "square", vol = 0.05) {
    if (muted || !actx) return;
    const now = actx.currentTime, o = actx.createOscillator(), g = actx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f1, now);
    o.frequency.exponentialRampToValueAtTime(Math.max(20, f2), now + dur);
    g.gain.setValueAtTime(vol, now);
    g.gain.exponentialRampToValueAtTime(0.0001, now + dur);
    o.connect(g).connect(actx.destination);
    o.start(now);
    o.stop(now + dur + 0.02);
  }
  function boom(dur = 0.35, vol = 0.18) {
    if (muted || !actx) return;
    const now = actx.currentTime, src = actx.createBufferSource(), f = actx.createBiquadFilter(), g = actx.createGain();
    src.buffer = noiseBuf;
    f.type = "lowpass";
    f.frequency.setValueAtTime(1800, now);
    f.frequency.exponentialRampToValueAtTime(120, now + dur);
    g.gain.setValueAtTime(vol, now);
    g.gain.exponentialRampToValueAtTime(0.0001, now + dur);
    src.connect(f).connect(g).connect(actx.destination);
    src.start(now);
    src.stop(now + dur + 0.02);
  }

  // ---------- sizing ----------
  function resize() {
    const cs = getComputedStyle(document.body);
    const availW = document.body.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    const availH = document.body.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
    const scale = Math.max(0.2, Math.min(availW / W, availH / H));
    stage.style.width = W * scale + "px";
    stage.style.height = H * scale + "px";
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(W * scale * dpr);
    canvas.height = Math.round(H * scale * dpr);
    ctx.setTransform(canvas.width / W, 0, 0, canvas.height / H, 0, 0);
    nebula = ctx.createRadialGradient(W * 0.7, H * 0.25, 10, W * 0.7, H * 0.25, H * 0.7);
    nebula.addColorStop(0, "rgba(185,139,255,0.16)");
    nebula.addColorStop(0.5, "rgba(92,225,255,0.05)");
    nebula.addColorStop(1, "rgba(11,10,31,0)");
  }

  // ---------- state ----------
  const keys = new Set();
  const pointer = { active: false, x: W / 2, y: H - 100, touch: false };
  const stars = Array.from({ length: 110 }, () => ({ x: rand(0, W), y: rand(0, H), z: rand(0.2, 1) }));
  let nebula = null;
  let state = "menu", paused = false, t = 0, clock = 0, gameOverAt = 0;
  let player, bullets, enemies, particles, powerups, floaters, boss;
  let score, sector, progress, nextSpawn, shake, banner;
  let highscore = 0, newRecord = false;

  function reset() {
    player = { x: W / 2, y: H - 80, lives: 3, lastShot: -1e4, rapidUntil: 0, spreadUntil: 0, shieldUntil: 0, invulnUntil: 0 };
    bullets = []; enemies = []; particles = []; powerups = []; floaters = [];
    boss = null;
    score = 0; sector = 1; progress = 0; nextSpawn = 900; shake = 0; t = 0;
    paused = false; newRecord = false;
    banner = { text: "SECTOR 01", sub: "Vijandelijke verkenners naderen", until: 2400 };
  }

  // ---------- entities ----------
  const KINDS = {
    scout:   { size: 26, hp: 1, speed: 3.0, color: "flare",  points: 10, shoots: false },
    fighter: { size: 32, hp: 2, speed: 2.0, color: "gold",   points: 25, shoots: true },
    tank:    { size: 46, hp: 6, speed: 1.0, color: "plasma", points: 60, shoots: true },
  };
  const POWERUPS = {
    rapid:  { color: "gold",  letter: "R", name: "Snelvuur" },
    spread: { color: "ion",   letter: "S", name: "Spreidschot" },
    shield: { color: "mint",  letter: "B", name: "Schild" },
    life:   { color: "flare", letter: "+", name: "Extra leven" },
  };

  const shot = (x, y, vx, vy, friendly) => ({ x, y, vx, vy, friendly, dead: false });

  function spawnEnemy(kind) {
    const k = KINDS[kind], hp = k.hp + Math.floor(sector / 4), x = rand(k.size, W - k.size);
    enemies.push({
      kind, x, baseX: x, y: -k.size, size: k.size, hp, maxHp: hp,
      speed: k.speed + sector * 0.15, color: C[k.color], points: k.points, shoots: k.shoots,
      phase: rand(0, Math.PI * 2), nextShot: t + rand(800, 2000), flash: 0, dead: false,
    });
  }

  function spawnBoss() {
    const hp = 70 + sector * 12;
    boss = { x: W / 2, y: -60, w: 156, h: 72, hp, maxHp: hp, entering: true, anchor: 0,
             nextAttack: 0, pattern: 0, stream: 0, streamNext: 0, spin: 0, flash: 0 };
    banner = { text: "WAARSCHUWING", sub: "Moederschip nadert", until: t + 2600 };
    tone(120, 50, 1.0, "sawtooth", 0.06);
  }

  function explode(x, y, color, n = 24, power = 5) {
    for (let i = 0; i < n; i++) {
      const a = rand(0, Math.PI * 2), s = rand(0.8, power);
      const life = rand(20, 42) | 0;
      particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life, max: life, color, size: rand(1.5, 3.5) });
    }
  }

  function floatText(x, y, text, color) { floaters.push({ x, y, text, color, life: 50 }); }

  function dropPowerup(x, y, kind) {
    kind = kind || pick({ rapid: 3, spread: 3, shield: 2, life: 1 });
    powerups.push({ x, y, kind, dead: false });
  }

  function addScore(points, x, y) {
    score += points;
    floatText(x, y, "+" + points, C.text);
    if (boss) return;
    progress += points;
    if (progress >= SECTOR_POINTS) {
      progress -= SECTOR_POINTS;
      sector++;
      if (sector % BOSS_EVERY === 0) spawnBoss();
      else banner = { text: "SECTOR " + pad(sector, 2), sub: "De vijand wordt sneller", until: t + 2000 };
      tone(440, 880, 0.25, "triangle", 0.05);
    }
  }

  // ---------- update ----------
  function shoot() {
    const delay = t < player.rapidUntil ? 95 : 210;
    if (t - player.lastShot < delay) return;
    player.lastShot = t;
    const y = player.y - 22;
    bullets.push(shot(player.x, y, 0, -11, true));
    if (t < player.spreadUntil) {
      bullets.push(shot(player.x - 6, y + 4, -2.6, -10.4, true), shot(player.x + 6, y + 4, 2.6, -10.4, true));
    }
    tone(900, 380, 0.07, "square", 0.02);
  }

  function updatePlayer() {
    const dx = (keys.has("ArrowRight") || keys.has("KeyD")) - (keys.has("ArrowLeft") || keys.has("KeyA"));
    const dy = (keys.has("ArrowDown") || keys.has("KeyS")) - (keys.has("ArrowUp") || keys.has("KeyW"));
    player.x += dx * 5.5;
    player.y += dy * 5.5;
    if (pointer.active) {
      const tx = pointer.x, ty = pointer.y - (pointer.touch ? 70 : 0);
      const ddx = tx - player.x, ddy = ty - player.y, d = Math.hypot(ddx, ddy);
      if (d > 0.5) {
        const m = Math.min(d, 10);
        player.x += (ddx / d) * m;
        player.y += (ddy / d) * m;
      }
    }
    player.x = clamp(player.x, 20, W - 20);
    player.y = clamp(player.y, H * 0.3, H - 28);
    if (keys.has("Space") || pointer.active) shoot();
  }

  function aimAt(x, y) { return Math.atan2(player.y - y, player.x - x); }

  function updateEnemy(e) {
    e.y += e.speed;
    if (e.kind === "fighter") e.x = clamp(e.baseX + Math.sin(e.y / 40 + e.phase) * 60, e.size / 2, W - e.size / 2);
    if (e.flash) e.flash--;
    if (e.shoots && t >= e.nextShot && e.y > 0 && e.y < H * 0.7) {
      e.nextShot = t + Math.max(500, rand(1400, 2600) - sector * 80);
      const a = aimAt(e.x, e.y), spd = 3.6 + sector * 0.18;
      const spreads = e.kind === "tank" ? [-0.3, 0, 0.3] : [0];
      for (const s of spreads) bullets.push(shot(e.x, e.y + e.size / 2, Math.cos(a + s) * spd, Math.sin(a + s) * spd, false));
    }
    if (e.y - e.size > H) e.dead = true;
  }

  function updateBoss() {
    const b = boss;
    if (b.entering) {
      b.y += 1.1;
      if (b.y >= 120) { b.entering = false; b.anchor = t; b.nextAttack = t + 800; }
    } else {
      b.x = W / 2 + Math.sin((t - b.anchor) / 1300) * (W / 2 - 100);
      b.y = 120 + Math.sin((t - b.anchor) / 700) * 14;
    }
    if (b.flash) b.flash--;
    if (!b.entering && t >= b.nextAttack) {
      const spd = 2.8 + sector * 0.05;
      if (b.pattern === 0) {
        const n = 14, off = rand(0, (Math.PI * 2) / n);
        for (let i = 0; i < n; i++) {
          const a = off + (i * Math.PI * 2) / n;
          bullets.push(shot(b.x, b.y, Math.cos(a) * spd, Math.sin(a) * spd, false));
        }
      } else if (b.pattern === 1) {
        const a = aimAt(b.x, b.y);
        for (let i = -2; i <= 2; i++) bullets.push(shot(b.x, b.y + 20, Math.cos(a + i * 0.24) * 4.4, Math.sin(a + i * 0.24) * 4.4, false));
      } else {
        b.stream = 22;
      }
      tone(200, 90, 0.2, "sawtooth", 0.03);
      b.pattern = (b.pattern + 1) % 3;
      b.nextAttack = t + Math.max(900, 1700 - sector * 25);
    }
    if (b.stream > 0 && t >= b.streamNext) {
      b.stream--;
      b.streamNext = t + 70;
      b.spin += 0.32;
      for (const arm of [0, Math.PI]) {
        const a = b.spin + arm;
        bullets.push(shot(b.x, b.y, Math.cos(a) * 3.2, Math.sin(a) * 3.2, false));
      }
    }
  }

  function hitEnemy(e) {
    e.hp--;
    e.flash = 4;
    if (e.hp > 0) {
      explode(e.x, e.y + e.size / 2, C.text, 4, 2);
      tone(260, 140, 0.05, "triangle", 0.03);
      return;
    }
    e.dead = true;
    explode(e.x, e.y, e.color, e.kind === "tank" ? 40 : 24);
    boom(e.kind === "tank" ? 0.5 : 0.3, 0.14);
    shake = Math.max(shake, e.kind === "tank" ? 8 : 3);
    addScore(e.points, e.x, e.y);
    if (Math.random() < (e.kind === "tank" ? 0.35 : 0.1)) dropPowerup(e.x, e.y);
  }

  function hitBoss() {
    boss.hp--;
    boss.flash = 3;
    explode(boss.x + rand(-40, 40), boss.y + boss.h / 2, C.plasma, 3, 2);
    if (boss.hp > 0) return;
    const { x, y } = boss;
    boss = null;
    for (let i = 0; i < 6; i++) explode(x + rand(-70, 70), y + rand(-30, 30), i % 2 ? C.plasma : C.gold, 30, 7);
    for (const b of bullets) if (!b.friendly) { b.dead = true; explode(b.x, b.y, C.spark, 2, 1.5); }
    boom(1.2, 0.3);
    shake = 24;
    const bonus = 500 + sector * 50;
    score += bonus;
    floatText(x, y, "+" + bonus, C.gold);
    sector++;
    progress = 0;
    banner = { text: "SECTOR " + pad(sector, 2), sub: "Moederschip vernietigd", until: t + 2600 };
    dropPowerup(x - 30, y, "shield");
    dropPowerup(x + 30, y);
    nextSpawn = t + 1500;
  }

  function damagePlayer() {
    if (t < player.shieldUntil) { explode(player.x, player.y, C.mint, 6, 2); return; }
    if (t < player.invulnUntil) return;
    player.lives--;
    player.invulnUntil = t + 2000;
    shake = 16;
    explode(player.x, player.y, C.ion, 40);
    boom(0.6, 0.25);
    tone(300, 60, 0.5, "sawtooth", 0.06);
    if (player.lives <= 0) gameOver();
  }

  function applyPowerup(kind) {
    if (kind === "rapid") player.rapidUntil = t + 8000;
    else if (kind === "spread") player.spreadUntil = t + 8000;
    else if (kind === "shield") player.shieldUntil = t + 6000;
    else player.lives = Math.min(5, player.lives + 1);
    floatText(player.x, player.y - 30, POWERUPS[kind].name, C[POWERUPS[kind].color]);
    tone(520, 1300, 0.18, "sine", 0.07);
  }

  function update() {
    t += STEP;
    updatePlayer();

    if (!boss && t >= nextSpawn) {
      spawnEnemy(pick({ scout: 6, fighter: Math.min(5, sector), tank: Math.max(0, sector - 2) }));
      nextSpawn = t + Math.max(260, 1100 - sector * 85) + rand(0, 400);
    } else if (boss && !boss.entering && t >= nextSpawn) {
      spawnEnemy("scout");
      nextSpawn = t + 2600;
    }

    for (const e of enemies) updateEnemy(e);
    if (boss) updateBoss();
    for (const b of bullets) {
      b.x += b.vx;
      b.y += b.vy;
      if (b.y < -20 || b.y > H + 20 || b.x < -20 || b.x > W + 20) b.dead = true;
    }
    for (const p of powerups) { p.y += 2; if (p.y > H + 20) p.dead = true; }

    for (const b of bullets) {
      if (!b.friendly || b.dead) continue;
      for (const e of enemies) {
        if (!e.dead && Math.abs(b.x - e.x) < e.size / 2 + 3 && Math.abs(b.y - e.y) < e.size / 2 + 6) {
          b.dead = true;
          hitEnemy(e);
          break;
        }
      }
      if (!b.dead && boss && boss.y > 0 && Math.abs(b.x - boss.x) < boss.w / 2 && Math.abs(b.y - boss.y) < boss.h / 2) {
        b.dead = true;
        hitBoss();
      }
    }

    if (state === "playing") {
      for (const b of bullets) {
        if (!b.friendly && !b.dead && Math.hypot(b.x - player.x, b.y - player.y) < 13) { b.dead = true; damagePlayer(); }
      }
    }
    if (state === "playing") {
      for (const e of enemies) {
        if (!e.dead && Math.hypot(e.x - player.x, e.y - player.y) < e.size / 2 + 10) {
          e.dead = true;
          explode(e.x, e.y, e.color);
          damagePlayer();
        }
      }
    }
    if (state === "playing" && boss && Math.abs(player.x - boss.x) < boss.w / 2 + 8 && Math.abs(player.y - boss.y) < boss.h / 2 + 10) damagePlayer();
    for (const p of powerups) {
      if (state === "playing" && !p.dead && Math.hypot(p.x - player.x, p.y - player.y) < 26) { p.dead = true; applyPowerup(p.kind); }
    }

    bullets = bullets.filter((b) => !b.dead);
    enemies = enemies.filter((e) => !e.dead);
    powerups = powerups.filter((p) => !p.dead);
  }

  function updateEffects() {
    for (const p of particles) { p.x += p.vx; p.y += p.vy; p.vx *= 0.95; p.vy *= 0.95; p.life--; }
    particles = particles.filter((p) => p.life > 0);
    for (const f of floaters) { f.y -= 0.8; f.life--; }
    floaters = floaters.filter((f) => f.life > 0);
    shake = shake > 0.5 ? shake * 0.88 : 0;
  }

  function tick() {
    clock += STEP;
    if (paused) return;
    for (const s of stars) { s.y += s.z * 3; if (s.y > H) { s.y = -2; s.x = rand(0, W); } }
    if (state === "playing") update();
    updateEffects();
  }

  // ---------- game flow ----------
  function startGame() {
    audio();
    reset();
    state = "playing";
    tone(330, 660, 0.2, "triangle", 0.05);
    updateButtons();
  }

  function gameOver() {
    state = "gameover";
    gameOverAt = clock;
    newRecord = score > highscore;
    if (newRecord) { highscore = score; saveHigh(score); }
    explode(player.x, player.y, C.ion, 70, 8);
    updateButtons();
  }

  function setPaused(v) {
    if (state !== "playing") return;
    paused = v;
    keys.clear();
    pointer.active = false;
    updateButtons();
  }

  function canRestart() { return state === "menu" || (state === "gameover" && clock - gameOverAt > 700); }

  // ---------- drawing ----------
  function text(str, x, y, { size = 16, font = DISPLAY, weight = 600, color = C.text, align = "center", spacing = 0, glow = null } = {}) {
    ctx.font = `${weight} ${size}px ${font}`;
    ctx.textAlign = align;
    ctx.textBaseline = "alphabetic";
    if ("letterSpacing" in ctx) ctx.letterSpacing = spacing + "px";
    ctx.fillStyle = color;
    if (glow) { ctx.shadowColor = glow; ctx.shadowBlur = 18; }
    ctx.fillText(str, x, y);
    ctx.shadowBlur = 0;
    if ("letterSpacing" in ctx) ctx.letterSpacing = "0px";
  }

  function path(points) {
    ctx.beginPath();
    ctx.moveTo(points[0], points[1]);
    for (let i = 2; i < points.length; i += 2) ctx.lineTo(points[i], points[i + 1]);
    ctx.closePath();
  }

  function drawShip(x, y, scale = 1, shield = false) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(scale, scale);
    ctx.fillStyle = C.gold;
    path([-6, 12, 6, 12, 0, 12 + rand(8, 16)]);
    ctx.fill();
    ctx.shadowColor = C.ion;
    ctx.shadowBlur = 14;
    ctx.fillStyle = C.ion;
    path([0, -20, 17, 20, 0, 10, -17, 20]);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.strokeStyle = C.text;
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.fillStyle = C.void;
    ctx.beginPath(); ctx.arc(0, 3, 5, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = C.text;
    ctx.beginPath(); ctx.arc(0, 3, 2.2, 0, Math.PI * 2); ctx.fill();
    if (shield) {
      ctx.strokeStyle = C.mint;
      ctx.lineWidth = 2;
      ctx.globalAlpha = 0.55 + Math.sin(clock / 90) * 0.3;
      ctx.beginPath(); ctx.arc(0, 2, 30, 0, Math.PI * 2); ctx.stroke();
    }
    ctx.restore();
  }

  function drawEnemy(e) {
    const s = e.size / 2;
    ctx.save();
    ctx.translate(e.x, e.y);
    ctx.fillStyle = e.flash ? C.text : e.color;
    if (e.kind === "scout") path([-s, -s, s, -s, 0, s]);
    else if (e.kind === "fighter") path([0, s, s, 0, s - 6, -s, -s + 6, -s, -s, 0]);
    else path([-s + 10, -s, s - 10, -s, s, 0, s - 10, s, -s + 10, s, -s, 0]);
    ctx.fill();
    ctx.strokeStyle = C.void;
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.fillStyle = C.void;
    ctx.beginPath(); ctx.arc(0, e.kind === "scout" ? -s * 0.3 : 0, s * 0.24, 0, Math.PI * 2); ctx.fill();
    if (e.maxHp > 1 && e.hp < e.maxHp) {
      ctx.fillStyle = C.hull;
      ctx.fillRect(-s, -s - 8, e.size, 3);
      ctx.fillStyle = C.mint;
      ctx.fillRect(-s, -s - 8, (e.size * e.hp) / e.maxHp, 3);
    }
    ctx.restore();
  }

  function drawBoss(b) {
    const w = b.w / 2, h = b.h / 2;
    ctx.save();
    ctx.translate(b.x, b.y);
    ctx.shadowColor = C.plasma;
    ctx.shadowBlur = 24;
    ctx.fillStyle = b.flash ? C.text : C.plasma;
    path([-w, 0, -w + 28, -h, w - 28, -h, w, 0, w - 36, h, -w + 36, h]);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = C.hull;
    path([-w * 0.7, 0, -w * 0.7 + 20, -h * 0.6, w * 0.7 - 20, -h * 0.6, w * 0.7, 0, w * 0.7 - 26, h * 0.65, -w * 0.7 + 26, h * 0.65]);
    ctx.fill();
    ctx.fillStyle = C.gold;
    ctx.fillRect(-w + 34, h - 4, 10, 12);
    ctx.fillRect(w - 44, h - 4, 10, 12);
    const r = 12 + Math.sin(clock / 150) * 3;
    ctx.shadowColor = C.flare;
    ctx.shadowBlur = 20;
    ctx.fillStyle = C.flare;
    ctx.beginPath(); ctx.arc(0, 4, r, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  function drawBullet(b) {
    if (b.friendly) {
      ctx.fillStyle = C.ion;
      ctx.globalAlpha = 0.3;
      ctx.fillRect(b.x - 4, b.y - 10, 8, 18);
      ctx.globalAlpha = 1;
      ctx.fillRect(b.x - 2, b.y - 8, 4, 14);
    } else {
      ctx.fillStyle = C.spark;
      ctx.globalAlpha = 0.3;
      ctx.beginPath(); ctx.arc(b.x, b.y, 7, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1;
      ctx.beginPath(); ctx.arc(b.x, b.y, 4, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = C.text;
      ctx.beginPath(); ctx.arc(b.x, b.y, 1.8, 0, Math.PI * 2); ctx.fill();
    }
  }

  function drawPowerupIcon(x, y, kind, r = 12) {
    const p = POWERUPS[kind];
    ctx.fillStyle = C[p.color];
    ctx.shadowColor = C[p.color];
    ctx.shadowBlur = 12;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.font = `700 ${Math.round(r * 1.25)}px ${DISPLAY}`;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillStyle = C.void;
    ctx.fillText(p.letter, x, y + 1);
    ctx.textBaseline = "alphabetic";
  }

  function drawWorld() {
    for (const p of powerups) drawPowerupIcon(p.x, p.y, p.kind, 11 + Math.sin(clock / 120) * 1.5);
    for (const e of enemies) drawEnemy(e);
    if (boss) drawBoss(boss);
    for (const b of bullets) drawBullet(b);
    ctx.globalAlpha = 1;
    if (state === "playing" && !(t < player.invulnUntil && Math.floor(t / 100) % 2)) {
      drawShip(player.x, player.y, 1, t < player.shieldUntil);
    }
  }

  function drawEffects() {
    ctx.globalCompositeOperation = "lighter";
    for (const p of particles) {
      ctx.globalAlpha = p.life / p.max;
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, Math.max(0.5, (p.size * p.life) / p.max), 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalCompositeOperation = "source-over";
    for (const f of floaters) {
      ctx.globalAlpha = Math.min(1, f.life / 30);
      text(f.text, f.x, f.y, { size: 14, font: MONO, color: f.color });
    }
    ctx.globalAlpha = 1;
  }

  function drawHud() {
    text(pad(score, 6), 16, 36, { size: 26, font: MONO, align: "left" });
    text("SECTOR " + pad(sector, 2), 16, 56, { size: 13, color: C.dim, align: "left", spacing: 2 });
    text("HI " + pad(Math.max(highscore, score), 6), 16, 74, { size: 12, font: MONO, weight: 500, color: C.dim, align: "left" });
    ctx.fillStyle = C.hull;
    ctx.fillRect(16, 82, 104, 3);
    ctx.fillStyle = boss ? C.plasma : C.ion;
    ctx.fillRect(16, 82, boss ? 104 : (104 * progress) / SECTOR_POINTS, 3);

    if (boss) {
      const x0 = 140, x1 = W - 135;
      text("MOEDERSCHIP", (x0 + x1) / 2, 26, { size: 11, color: C.plasma, spacing: 3 });
      ctx.fillStyle = C.hull;
      ctx.fillRect(x0, 33, x1 - x0, 5);
      ctx.fillStyle = C.plasma;
      ctx.fillRect(x0, 33, ((x1 - x0) * boss.hp) / boss.maxHp, 5);
    }

    for (let i = 0; i < player.lives; i++) drawShip(W - 22 - i * 24, H - 26, 0.45);

    const active = [];
    if (t < player.rapidUntil) active.push(["rapid", player.rapidUntil, 8000]);
    if (t < player.spreadUntil) active.push(["spread", player.spreadUntil, 8000]);
    if (t < player.shieldUntil) active.push(["shield", player.shieldUntil, 6000]);
    active.forEach(([kind, until, total], i) => {
      const y = H - 24 - i * 26;
      drawPowerupIcon(26, y, kind, 9);
      ctx.fillStyle = C.hull;
      ctx.fillRect(42, y - 2, 70, 4);
      ctx.fillStyle = C[POWERUPS[kind].color];
      ctx.fillRect(42, y - 2, (70 * (until - t)) / total, 4);
    });

    if (t < banner.until) {
      ctx.globalAlpha = Math.min(1, (banner.until - t) / 400);
      const warn = banner.text === "WAARSCHUWING";
      text(banner.text, W / 2, H * 0.4, { size: 36, weight: 700, color: warn ? C.flare : C.text, spacing: 4, glow: warn ? C.flare : C.ion });
      text(banner.sub, W / 2, H * 0.4 + 30, { size: 15, weight: 500, color: C.dim });
      ctx.globalAlpha = 1;
    }
  }

  function veil(alpha) {
    ctx.globalAlpha = alpha;
    ctx.fillStyle = C.void;
    ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = 1;
  }

  function drawMenu() {
    text("STERRENJAGER", W / 2, 180, { size: 50, weight: 700, color: C.text, spacing: 3, glow: C.ion });
    text("Verdedig de sector. Overleef het moederschip.", W / 2, 214, { size: 15, weight: 500, color: C.dim });
    drawShip(W / 2, 300 + Math.sin(clock / 400) * 6, 1.6);

    const rows = [
      ["Bewegen", "pijltjes, WASD of slepen"],
      ["Schieten", "spatie of ingedrukt houden"],
      ["Pauze", "P of Esc"],
      ["Geluid", "M"],
    ];
    rows.forEach(([k, v], i) => {
      const y = 400 + i * 24;
      text(k.toUpperCase(), W / 2 - 12, y, { size: 12, color: C.ion, align: "right", spacing: 2 });
      text(v, W / 2 + 12, y, { size: 14, weight: 500, color: C.text, align: "left" });
    });

    const kinds = Object.keys(POWERUPS);
    kinds.forEach((kind, i) => {
      const col = i % 2, row = Math.floor(i / 2);
      const x = W / 2 - 150 + col * 160, y = 520 + row * 32;
      drawPowerupIcon(x, y - 5, kind, 10);
      text(POWERUPS[kind].name, x + 18, y, { size: 14, weight: 500, align: "left" });
    });

    text("HIGHSCORE " + pad(highscore, 6), W / 2, 612, { size: 14, font: MONO, color: C.gold });
    if (Math.floor(clock / 500) % 2 === 0) {
      text("ENTER OF TIK OM TE STARTEN", W / 2, 660, { size: 17, weight: 700, color: C.mint, spacing: 2 });
    }
  }

  function drawGameOver() {
    veil(0.55);
    text("GAME OVER", W / 2, 250, { size: 52, weight: 700, color: C.flare, spacing: 4, glow: C.flare });
    text(pad(score, 6), W / 2, 310, { size: 34, font: MONO });
    text("Gestrand in sector " + pad(sector, 2), W / 2, 340, { size: 15, weight: 500, color: C.dim });
    if (newRecord) text("NIEUWE HIGHSCORE", W / 2, 380, { size: 18, weight: 700, color: C.gold, spacing: 2, glow: C.gold });
    else text("HIGHSCORE " + pad(highscore, 6), W / 2, 380, { size: 14, font: MONO, color: C.dim });
    if (canRestart() && Math.floor(clock / 500) % 2 === 0) {
      text("ENTER OF TIK OM OPNIEUW TE SPELEN", W / 2, 470, { size: 16, weight: 700, color: C.mint, spacing: 1 });
    }
  }

  function drawPaused() {
    veil(0.6);
    text("PAUZE", W / 2, H / 2 - 10, { size: 48, weight: 700, spacing: 6, glow: C.ion });
    text("P, Esc of tik om verder te gaan", W / 2, H / 2 + 24, { size: 15, weight: 500, color: C.dim });
  }

  function render() {
    ctx.save();
    ctx.fillStyle = C.void;
    ctx.fillRect(0, 0, W, H);
    if (nebula) { ctx.fillStyle = nebula; ctx.fillRect(0, 0, W, H); }
    ctx.fillStyle = C.text;
    for (const s of stars) {
      ctx.globalAlpha = 0.25 + s.z * 0.7;
      const size = s.z > 0.8 ? 2 : 1;
      ctx.fillRect(s.x, s.y, size, size);
    }
    ctx.globalAlpha = 1;
    if (shake && !reducedMotion) ctx.translate(rand(-shake, shake), rand(-shake, shake));
    if (state !== "menu") drawWorld();
    drawEffects();
    ctx.restore();

    if (state === "menu") drawMenu();
    else if (state === "playing") { drawHud(); if (paused) drawPaused(); }
    else drawGameOver();
  }

  // ---------- input ----------
  const SOUND_ON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/><path d="M19 6a8.5 8.5 0 0 1 0 12"/></svg>';
  const SOUND_OFF = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M17 9l5 6M22 9l-5 6"/></svg>';

  function updateButtons() {
    soundBtn.innerHTML = muted ? SOUND_OFF : SOUND_ON;
    soundBtn.setAttribute("aria-pressed", String(!muted));
    pauseBtn.hidden = state !== "playing";
    pauseBtn.setAttribute("aria-pressed", String(paused));
  }

  function toggleMute() {
    muted = !muted;
    saveMuted(muted);
    audio();
    updateButtons();
  }

  soundBtn.addEventListener("click", toggleMute);
  pauseBtn.addEventListener("click", () => setPaused(!paused));

  window.addEventListener("keydown", (e) => {
    if (e.target instanceof HTMLButtonElement && (e.code === "Space" || e.code === "Enter")) return;
    audio();
    if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Space"].includes(e.code)) e.preventDefault();
    if (e.code === "Enter" && canRestart()) { startGame(); return; }
    if (e.code === "KeyP" || e.code === "Escape") { setPaused(!paused); return; }
    if (e.code === "KeyM") { toggleMute(); return; }
    if (!paused) keys.add(e.code);
  });
  window.addEventListener("keyup", (e) => keys.delete(e.code));
  window.addEventListener("blur", () => { keys.clear(); setPaused(true); });
  document.addEventListener("visibilitychange", () => { if (document.hidden) setPaused(true); });

  function pointerPos(e) {
    const r = canvas.getBoundingClientRect();
    pointer.x = ((e.clientX - r.left) / r.width) * W;
    pointer.y = ((e.clientY - r.top) / r.height) * H;
  }
  canvas.addEventListener("pointerdown", (e) => {
    audio();
    e.preventDefault();
    if (state !== "playing") { if (canRestart()) startGame(); return; }
    if (paused) { setPaused(false); return; }
    pointer.active = true;
    pointer.touch = e.pointerType !== "mouse";
    pointerPos(e);
    try { canvas.setPointerCapture(e.pointerId); } catch {}
  });
  canvas.addEventListener("pointermove", (e) => { if (pointer.active) pointerPos(e); });
  const release = () => { pointer.active = false; };
  canvas.addEventListener("pointerup", release);
  canvas.addEventListener("pointercancel", release);

  // ---------- loop ----------
  let last = performance.now(), acc = 0;
  function frame(now) {
    acc += Math.min(100, now - last);
    last = now;
    while (acc >= STEP) { tick(); acc -= STEP; }
    render();
    requestAnimationFrame(frame);
  }

  function boot(data) {
    data = data || {};
    highscore = Math.max(loadHigh(), data.highscore | 0);
    muted = typeof data.muted === "boolean" ? data.muted : loadMuted();
    reset();
    resize();
    updateButtons();
    window.addEventListener("resize", resize);
    if ("ResizeObserver" in window) new ResizeObserver(resize).observe(document.body);
    requestAnimationFrame(frame);
  }

  window.claude?.hot?.snapshot?.(() => ({ highscore, muted }));
  window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
})();
</script>
